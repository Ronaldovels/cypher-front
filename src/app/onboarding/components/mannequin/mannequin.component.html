<svg viewBox="0 0 400 700" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block">
  <defs>
    <filter id="epiGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feFlood flood-color="var(--accent)" flood-opacity="0.55"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="4" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- COLETE -->
  <g [class]="layerClass('colete')" [attr.filter]="isOn('colete') ? 'url(#epiGlow)' : null">
    @if (isApron()) {
      <g filter="url(#softShadow)">
        <path d="M148 198 L252 198 L262 412 L138 412 Z" [attr.fill]="coleteColor()" stroke="#3D2818" stroke-width="2"/>
        <path d="M182 196 L218 196 L216 218 L184 218 Z" fill="#5A3818"/>
        <ellipse cx="200" cy="218" rx="4" ry="4" fill="#2A1810"/>
      </g>
    } @else {
      <g filter="url(#softShadow)">
        <path d="M132 218 Q132 210 142 206 L168 196 L168 230 L232 230 L232 196 L258 206 Q268 210 268 218 L268 408 Q268 414 262 414 L138 414 Q132 414 132 408 Z"
              [attr.fill]="coleteColor()" stroke="#1a3320" stroke-width="2"/>
        <path d="M168 196 L200 224 L232 196 L232 208 L200 234 L168 208 Z" fill="#234A2A" stroke="#1a3320" stroke-width="1.6"/>
        <line x1="200" y1="234" x2="200" y2="412" stroke="#1a3320" stroke-width="2"/>
        <rect x="132" y="284" width="136" height="12" fill="#E8E2D0"/>
        <rect x="132" y="262" width="136" height="4" fill="#2A2A2A"/>
        <rect x="132" y="310" width="136" height="4" fill="#2A2A2A"/>
        <rect x="132" y="358" width="136" height="12" fill="#E8E2D0"/>
        <rect x="132" y="336" width="136" height="4" fill="#2A2A2A"/>
        <rect x="132" y="384" width="136" height="4" fill="#2A2A2A"/>
        <rect x="148" y="308" width="36" height="40" fill="none" stroke="#1a3320" stroke-width="1.6"/>
        <rect x="216" y="308" width="36" height="40" fill="none" stroke="#1a3320" stroke-width="1.6"/>
        <line x1="154" y1="244" x2="154" y2="272" stroke="#1a3320" stroke-width="1.4"/>
        <line x1="160" y1="244" x2="160" y2="272" stroke="#1a3320" stroke-width="1.4"/>
        <rect x="218" y="248" width="30" height="22" fill="#a8a59a" stroke="#1a3320" stroke-width="1.4"/>
      </g>
    }
  </g>

  <!-- CAPACETE -->
  <g [class]="layerClass('capacete')" [attr.filter]="isOn('capacete') ? 'url(#epiGlow)' : null">
    <g filter="url(#softShadow)">
      <path d="M138 110 Q138 60 200 60 Q262 60 262 110 L266 128 L134 128 Z"
            [attr.fill]="capColor()" stroke="#2A2A2A" stroke-width="2.4"/>
      <path d="M132 124 L268 124 L268 134 L132 134 Z" fill="#2A2A2A"/>
      <path d="M170 72 Q170 115 174 124" stroke="#2A2A2A" stroke-width="1.8" fill="none" opacity="0.55"/>
      <path d="M200 64 L200 124" stroke="#2A2A2A" stroke-width="1.8" fill="none" opacity="0.55"/>
      <path d="M230 72 Q230 115 226 124" stroke="#2A2A2A" stroke-width="1.8" fill="none" opacity="0.55"/>
      <path d="M156 78 Q160 70 184 68" stroke="#fff" stroke-width="3" fill="none" opacity="0.4" stroke-linecap="round"/>
      @if (hasJugular()) {
        <path d="M150 132 Q200 168 250 132" stroke="#2A2A2A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      }
    </g>
  </g>

  <!-- ÓCULOS -->
  @if (!respFull()) {
    <g [class]="layerClass('oculos')" [attr.filter]="isOn('oculos') ? 'url(#epiGlow)' : null">
      @if (oculoStyle() === 'face') {
        <g filter="url(#softShadow)">
          <path d="M144 148 L256 148 Q260 188 256 206 L144 206 Q140 188 144 148 Z"
                fill="rgba(180,210,225,0.55)" stroke="#2A4858" stroke-width="2.4"/>
          <path d="M148 150 L252 150 L252 156 L148 156 Z" fill="#2A4858"/>
        </g>
      } @else {
        <g filter="url(#softShadow)">
          <path d="M148 154 Q148 144 162 144 L238 144 Q252 144 252 154 L252 172 Q252 184 238 184 L162 184 Q148 184 148 172 Z"
                [attr.fill]="oculoStyle() === 'dark' ? '#1a1a1a' : 'rgba(180,210,225,0.7)'"
                stroke="#2A2A2A" stroke-width="2.4"/>
          <path d="M196 158 Q200 152 204 158 L204 174 Q200 178 196 174 Z" fill="#2A2A2A"/>
          <line x1="148" y1="162" x2="132" y2="160" stroke="#2A2A2A" stroke-width="2.4" stroke-linecap="round"/>
          <line x1="252" y1="162" x2="268" y2="160" stroke="#2A2A2A" stroke-width="2.4" stroke-linecap="round"/>
          @if (oculoStyle() === 'std') {
            <path d="M158 152 L172 152" stroke="#fff" stroke-width="2" opacity="0.7" stroke-linecap="round"/>
            <path d="M218 152 L232 152" stroke="#fff" stroke-width="2" opacity="0.7" stroke-linecap="round"/>
          }
        </g>
      }
    </g>
  }

  <!-- MÁSCARA -->
  <g [class]="layerClass('mascara')" [attr.filter]="isOn('mascara') ? 'url(#epiGlow)' : null">
    @if (respFull()) {
      <g filter="url(#softShadow)">
        <path d="M132 128 L268 128 Q278 168 274 200 Q264 222 200 224 Q136 222 126 200 Q122 168 132 128 Z"
              fill="#34373F" stroke="#0a0a0a" stroke-width="2.4"/>
        <ellipse cx="200" cy="160" rx="58" ry="22" fill="rgba(180,210,230,0.65)" stroke="#0a0a0a" stroke-width="2"/>
        <circle cx="200" cy="202" r="15" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="2"/>
        <circle cx="200" cy="202" r="7" fill="#0a0a0a"/>
      </g>
    } @else {
      <g filter="url(#softShadow)">
        <path d="M150 178 L250 178 Q260 198 250 218 L150 218 Q140 198 150 178 Z"
              fill="#F4F2EC" stroke="#2A2A2A" stroke-width="2.4"/>
        <path d="M150 178 L250 178" stroke="#2A2A2A" stroke-width="1.4" opacity="0.5"/>
        <path d="M148 196 L252 196" stroke="#2A2A2A" stroke-width="1.4" opacity="0.5"/>
        <path d="M150 210 L250 210" stroke="#2A2A2A" stroke-width="1.4" opacity="0.5"/>
        <circle cx="200" cy="198" r="8" fill="#C4C0B5" stroke="#2A2A2A" stroke-width="1.4"/>
        <line x1="144" y1="190" x2="128" y2="186" stroke="#2A2A2A" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="256" y1="190" x2="272" y2="186" stroke="#2A2A2A" stroke-width="1.6" stroke-linecap="round"/>
      </g>
    }
  </g>

  <!-- LUVAS -->
  <g [class]="layerClass('luvas')" [attr.filter]="isOn('luvas') ? 'url(#epiGlow)' : null">
    <g filter="url(#softShadow)">
      <g transform="translate(64 426) rotate(-12)">
        <path d="M0 0 Q-4 -8 4 -10 L24 -10 Q32 -8 28 0 L34 16 Q36 36 28 48 L4 48 Q-4 36 -2 16 Z"
              [attr.fill]="luvaColor()" stroke="#2A2A2A" stroke-width="2"/>
        <path d="M28 6 Q40 8 42 18 Q40 26 32 24" [attr.fill]="luvaColor()" stroke="#2A2A2A" stroke-width="2"/>
        <rect x="-2" y="42" width="34" height="14" [attr.fill]="accent()" stroke="#2A2A2A" stroke-width="1.8"/>
        <line x1="4" y1="10" x2="4" y2="36" stroke="#2A2A2A" stroke-width="1" opacity="0.4"/>
        <line x1="12" y1="6" x2="12" y2="36" stroke="#2A2A2A" stroke-width="1" opacity="0.4"/>
        <line x1="20" y1="6" x2="20" y2="36" stroke="#2A2A2A" stroke-width="1" opacity="0.4"/>
      </g>
      <g transform="translate(336 426) rotate(12) scale(-1 1)">
        <path d="M0 0 Q-4 -8 4 -10 L24 -10 Q32 -8 28 0 L34 16 Q36 36 28 48 L4 48 Q-4 36 -2 16 Z"
              [attr.fill]="luvaColor()" stroke="#2A2A2A" stroke-width="2"/>
        <path d="M28 6 Q40 8 42 18 Q40 26 32 24" [attr.fill]="luvaColor()" stroke="#2A2A2A" stroke-width="2"/>
        <rect x="-2" y="42" width="34" height="14" [attr.fill]="accent()" stroke="#2A2A2A" stroke-width="1.8"/>
        <line x1="4" y1="10" x2="4" y2="36" stroke="#2A2A2A" stroke-width="1" opacity="0.4"/>
        <line x1="12" y1="6" x2="12" y2="36" stroke="#2A2A2A" stroke-width="1" opacity="0.4"/>
        <line x1="20" y1="6" x2="20" y2="36" stroke="#2A2A2A" stroke-width="1" opacity="0.4"/>
      </g>
    </g>
  </g>

  <!-- BOTAS -->
  <g [class]="layerClass('botas')" [attr.filter]="isOn('botas') ? 'url(#epiGlow)' : null">
    <g filter="url(#softShadow)">
      <path d="M138 590 L186 590 L196 656 L130 656 Z"
            [attr.fill]="isInsulating() ? '#3D3D3D' : '#1A1A1A'" stroke="#000" stroke-width="2"/>
      <path d="M214 590 L262 590 L270 656 L204 656 Z"
            [attr.fill]="isInsulating() ? '#3D3D3D' : '#1A1A1A'" stroke="#000" stroke-width="2"/>
      <rect x="126" y="650" width="74" height="14" rx="3" fill="#0a0a0a" stroke="#000" stroke-width="1.4"/>
      <rect x="200" y="650" width="74" height="14" rx="3" fill="#0a0a0a" stroke="#000" stroke-width="1.4"/>
      <line x1="148" y1="604" x2="180" y2="604" stroke="#F5E0C0" stroke-width="2"/>
      <line x1="148" y1="618" x2="180" y2="618" stroke="#F5E0C0" stroke-width="2"/>
      <line x1="148" y1="632" x2="180" y2="632" stroke="#F5E0C0" stroke-width="2"/>
      <line x1="222" y1="604" x2="254" y2="604" stroke="#F5E0C0" stroke-width="2"/>
      <line x1="222" y1="618" x2="254" y2="618" stroke="#F5E0C0" stroke-width="2"/>
      <line x1="222" y1="632" x2="254" y2="632" stroke="#F5E0C0" stroke-width="2"/>
      @if (isInsulating()) {
        <rect x="138" y="640" width="50" height="4" [attr.fill]="accent()"/>
        <rect x="214" y="640" width="50" height="4" [attr.fill]="accent()"/>
      }
    </g>
  </g>
</svg>
