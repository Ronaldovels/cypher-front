<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820" width="1500" height="820" font-family="'Liberation Sans', Arial, sans-serif">
  <defs>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ED145B"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D46C9"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker>
    <style>
      .t{font-family:Poppins,'Liberation Sans',sans-serif;font-weight:700;font-size:14px;fill:#1d1d1f}
      .th{font-family:Poppins,'Liberation Sans',sans-serif;font-weight:700;font-size:17px;fill:#1d1d1f}
      .s{font-size:11.5px;fill:#555}
      .sw{font-size:11.5px;fill:#e9e9e9}
      .tw{font-family:Poppins,'Liberation Sans',sans-serif;font-weight:700;font-size:14px;fill:#fff}
      .lbl{font-size:11px;fill:#ED145B;font-weight:700}
      .lblp{font-size:11px;fill:#6D46C9;font-weight:700}
      .lblg{font-size:11px;fill:#777;font-weight:700}
      .box{fill:#fff;stroke:#d8d4cf;stroke-width:1.2}
      .cont{fill:#F7F5F2;stroke:#cfcac3;stroke-width:1.2}
      .pbox{fill:#fff;stroke:#6D46C9;stroke-width:1.3}
    </style>
  </defs>
  <rect width="1500" height="820" fill="#ffffff"/>

  <!-- Cameras -->
  <rect x="20" y="140" width="195" height="112" rx="10" class="box" stroke="#1d1d1f"/>
  <text x="117" y="172" text-anchor="middle" class="t">Câmeras</text>
  <text x="117" y="194" text-anchor="middle" class="s">RTSP · ONVIF</text>
  <text x="117" y="212" text-anchor="middle" class="s">webcam · arquivo de vídeo</text>
  <text x="117" y="234" text-anchor="middle" class="s">(infraestrutura existente)</text>

  <!-- cypher-capture -->
  <rect x="240" y="70" width="460" height="660" rx="14" class="cont"/>
  <text x="262" y="100" class="th">cypher-capture</text>
  <text x="262" y="120" class="s">Python · OpenCV · Ultralytics · ByteTrack</text>

  <rect x="262" y="138" width="416" height="54" rx="8" class="box"/>
  <text x="470" y="161" text-anchor="middle" class="t">Captura resiliente</text>
  <text x="470" y="180" text-anchor="middle" class="s">reconexão com backoff · um processo por câmera</text>

  <rect x="262" y="218" width="203" height="100" rx="8" class="box"/>
  <text x="363" y="243" text-anchor="middle" class="t">YOLO11s-pose</text>
  <text x="363" y="263" text-anchor="middle" class="s">+ ByteTrack, todo frame</text>
  <text x="363" y="281" text-anchor="middle" class="s">17 keypoints por pessoa</text>
  <text x="363" y="299" text-anchor="middle" class="s">IDs efêmeros (LGPD)</text>

  <rect x="475" y="218" width="203" height="100" rx="8" class="box"/>
  <text x="576" y="243" text-anchor="middle" class="t">YOLO26m · EPI</text>
  <text x="576" y="263" text-anchor="middle" class="s">7 classes · fine-tuning</text>
  <text x="576" y="281" text-anchor="middle" class="s">mAP@0.5 = 0,915</text>
  <text x="576" y="299" text-anchor="middle" class="s">stride adaptativo</text>

  <rect x="262" y="344" width="416" height="124" rx="8" fill="#1d1d1f"/>
  <text x="470" y="372" text-anchor="middle" class="tw">Motor de decisão</text>
  <text x="470" y="394" text-anchor="middle" class="sw">associação EPI ↔ pessoa (containment + banda anatômica)</text>
  <text x="470" y="413" text-anchor="middle" class="sw">REBA · zonas críticas · histerese assimétrica</text>
  <text x="470" y="432" text-anchor="middle" class="sw">3 categorias de risco + EPI ausente</text>
  <text x="470" y="453" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ED145B">severidade 0–4</text>

  <rect x="262" y="494" width="416" height="70" rx="8" class="box"/>
  <text x="470" y="518" text-anchor="middle" class="t">IncidentTracker + fila de envio</text>
  <text x="470" y="537" text-anchor="middle" class="s">abre e fecha incidentes · fila de 256 (queda nunca descartada)</text>
  <text x="470" y="554" text-anchor="middle" class="s">spill em disco se a API estiver fora</text>

  <rect x="262" y="590" width="203" height="66" rx="8" class="box"/>
  <text x="363" y="614" text-anchor="middle" class="t">Stream MJPEG</text>
  <text x="363" y="633" text-anchor="middle" class="s">vídeo anotado ao vivo</text>
  <text x="363" y="648" text-anchor="middle" class="s">→ telas do cypher-front</text>

  <rect x="475" y="590" width="203" height="66" rx="8" class="box"/>
  <text x="576" y="614" text-anchor="middle" class="t">Orchestrator</text>
  <text x="576" y="633" text-anchor="middle" class="s">reconcilia o catálogo</text>
  <text x="576" y="648" text-anchor="middle" class="s">com os processos</text>

  <text x="470" y="690" text-anchor="middle" class="lbl">caminho crítico · p95 44,9 ms em GPU (orçamento 200 ms)</text>
  <text x="470" y="710" text-anchor="middle" class="s">CPU sem GPU: funciona, mas fora do orçamento</text>

  <!-- capture internal arrows -->
  <path d="M215,196 L258,166" stroke="#ED145B" stroke-width="2" fill="none" marker-end="url(#am)"/>
  <path d="M363,192 L363,214" stroke="#ED145B" stroke-width="2" marker-end="url(#am)"/>
  <path d="M576,192 L576,214" stroke="#ED145B" stroke-width="2" marker-end="url(#am)"/>
  <path d="M363,318 L363,340" stroke="#ED145B" stroke-width="2" marker-end="url(#am)"/>
  <path d="M576,318 L576,340" stroke="#ED145B" stroke-width="2" marker-end="url(#am)"/>
  <path d="M470,468 L470,490" stroke="#ED145B" stroke-width="2" marker-end="url(#am)"/>

  <!-- capture -> api -->
  <path d="M678,520 L716,520 L716,172 L756,172" stroke="#ED145B" stroke-width="2" fill="none" marker-end="url(#am)"/>
    <!-- config api -> orchestrator -->
  <path d="M756,196 L730,196 L730,623 L682,623" stroke="#8A8A8A" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#ag)"/>

  <!-- cypher backend -->
  <rect x="740" y="70" width="390" height="660" rx="14" class="cont"/>
  <text x="762" y="100" class="th">cypher</text>
  <text x="762" y="120" class="s">Spring Boot 4.1 · Java 21 · JPA · H2</text>

  <rect x="760" y="138" width="220" height="76" rx="8" class="box"/>
  <text x="870" y="162" text-anchor="middle" class="t">API de incidentes</text>
  <text x="870" y="181" text-anchor="middle" class="s">incidente + snapshot</text>
  <text x="870" y="198" text-anchor="middle" class="s">chave por câmera</text>

  <rect x="760" y="232" width="220" height="70" rx="8" class="box"/>
  <text x="870" y="256" text-anchor="middle" class="t">Persistência</text>
  <text x="870" y="275" text-anchor="middle" class="s">isolamento por empresa</text>
  <text x="870" y="291" text-anchor="middle" class="s">catálogo · zonas · placar</text>
  <path d="M870,214 L870,228" stroke="#ED145B" stroke-width="2" marker-end="url(#am)"/>

  <rect x="995" y="146" width="118" height="54" rx="8" class="box"/>
  <text x="1054" y="170" text-anchor="middle" class="t">SSE</text>
  <text x="1054" y="188" text-anchor="middle" class="s">push em tempo real</text>
  <path d="M980,172 L991,172" stroke="#ED145B" stroke-width="2" marker-end="url(#am)"/>

  <rect x="995" y="392" width="118" height="54" rx="8" class="box"/>
  <text x="1054" y="416" text-anchor="middle" class="t">Webhook</text>
  <text x="1054" y="434" text-anchor="middle" class="s">HMAC-SHA256</text>

  <rect x="995" y="462" width="118" height="54" rx="8" class="box"/>
  <text x="1054" y="486" text-anchor="middle" class="t">Servidor MCP</text>
  <text x="1054" y="504" text-anchor="middle" class="s">chave por empresa</text>
  <path d="M980,280 L1054,280 L1054,388" stroke="#ED145B" stroke-width="1.6" fill="none" marker-end="url(#am)"/>
  <path d="M1054,446 L1054,458" stroke="#ED145B" stroke-width="1.6" marker-end="url(#am)"/>

  <!-- LLM module -->
  <rect x="756" y="326" width="228" height="390" rx="10" fill="#F4F0FC" stroke="#6D46C9" stroke-width="1.4" stroke-dasharray="7 4"/>
  <text x="870" y="352" text-anchor="middle" class="t" fill="#6D46C9" style="fill:#6D46C9">Análise multimodal</text>
  <text x="870" y="370" text-anchor="middle" class="s">sob demanda · fora do tempo real</text>

  <rect x="772" y="384" width="196" height="58" rx="8" class="pbox"/>
  <text x="870" y="407" text-anchor="middle" class="t">PromptBuilder v2</text>
  <text x="870" y="426" text-anchor="middle" class="s">imagem + sinais da visão</text>

  <rect x="772" y="460" width="196" height="58" rx="8" class="pbox"/>
  <text x="870" y="483" text-anchor="middle" class="t">MultimodalRiskClient</text>
  <text x="870" y="502" text-anchor="middle" class="s">Claude | Gemini · retry</text>

  <rect x="772" y="536" width="196" height="58" rx="8" class="pbox"/>
  <text x="870" y="559" text-anchor="middle" class="t">LlmResponseParser</text>
  <text x="870" y="578" text-anchor="middle" class="s">JSON validado · 3 status</text>

  <rect x="772" y="612" width="196" height="58" rx="8" class="pbox"/>
  <text x="870" y="635" text-anchor="middle" class="t">Auditoria</text>
  <text x="870" y="654" text-anchor="middle" class="s">toda chamada registrada</text>
  <path d="M870,442 L870,456" stroke="#6D46C9" stroke-width="1.8" marker-end="url(#ap)"/>
  <path d="M870,518 L870,532" stroke="#6D46C9" stroke-width="1.8" marker-end="url(#ap)"/>
  <path d="M870,594 L870,608" stroke="#6D46C9" stroke-width="1.8" marker-end="url(#ap)"/>
  <text x="870" y="700" text-anchor="middle" class="lblp">o LLM comenta; nunca altera o incidente</text>

  <!-- front -->
  <rect x="1175" y="70" width="305" height="300" rx="14" class="cont"/>
  <text x="1197" y="100" class="th">cypher-front</text>
  <text x="1197" y="120" class="s">Angular · EventSource (SSE)</text>

  <rect x="1195" y="136" width="265" height="50" rx="8" class="box"/>
  <text x="1327" y="157" text-anchor="middle" class="t">Tela do operador</text>
  <text x="1327" y="175" text-anchor="middle" class="s">alerta visual e sonoro por severidade</text>

  <rect x="1195" y="196" width="265" height="50" rx="8" class="box"/>
  <text x="1327" y="217" text-anchor="middle" class="t">Dashboard do gestor</text>
  <text x="1327" y="235" text-anchor="middle" class="s">feed ao vivo · heatmap · placar</text>

  <rect x="1195" y="256" width="265" height="56" rx="8" class="pbox"/>
  <text x="1327" y="279" text-anchor="middle" class="t">Detalhe do incidente</text>
  <text x="1327" y="298" text-anchor="middle" class="s">"Analisar com IA" (só gestor)</text>

  <rect x="1195" y="322" width="265" height="36" rx="8" class="box"/>
  <text x="1327" y="345" text-anchor="middle" class="s">cadastro de câmeras, zonas e chaves MCP</text>

  <path d="M1113,172 L1191,172" stroke="#ED145B" stroke-width="2" marker-end="url(#am)"/>
  <!-- detalhe <-> llm -->
  <path d="M1191,284 L1140,284 L1140,352 L988,352" stroke="#6D46C9" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-start="url(#ap)" marker-end="url(#ap)"/>
  <text x="1133" y="322" text-anchor="end" class="lblp">sob demanda</text>

  <!-- externals -->
  <rect x="1175" y="392" width="305" height="54" rx="8" class="box" stroke="#1d1d1f"/>
  <text x="1327" y="415" text-anchor="middle" class="t">ERP · SCADA do cliente</text>
  <text x="1327" y="433" text-anchor="middle" class="s">evento assinado, filtro por severidade</text>
  <path d="M1113,419 L1171,419" stroke="#ED145B" stroke-width="1.8" marker-end="url(#am)"/>

  <rect x="1175" y="462" width="305" height="54" rx="8" class="box" stroke="#1d1d1f"/>
  <text x="1327" y="485" text-anchor="middle" class="t">Agentes de IA</text>
  <text x="1327" y="503" text-anchor="middle" class="s">consultas em linguagem natural</text>
  <path d="M1171,489 L1117,489" stroke="#8A8A8A" stroke-width="1.8" marker-end="url(#ag)"/>

  <rect x="1175" y="552" width="305" height="64" rx="8" fill="#F4F0FC" stroke="#6D46C9" stroke-width="1.3" stroke-dasharray="7 4"/>
  <text x="1327" y="577" text-anchor="middle" class="t">Claude · Gemini</text>
  <text x="1327" y="596" text-anchor="middle" class="s">provedor externo, trocado por configuração</text>
  <path d="M968,489 L988,489 L988,584 L1171,584" stroke="#6D46C9" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-start="url(#ap)" marker-end="url(#ap)"/>
  <text x="1080" y="576" text-anchor="middle" class="lblp">HTTPS · 20 s</text>

  <!-- legend -->
  <line x1="40" y1="780" x2="90" y2="780" stroke="#ED145B" stroke-width="2.4"/>
  <text x="100" y="784" font-size="12.5" fill="#1d1d1f">caminho de tempo real — do frame ao alerta, determinístico</text>
  <line x1="560" y1="780" x2="610" y2="780" stroke="#6D46C9" stroke-width="2.2" stroke-dasharray="6 4"/>
  <text x="620" y="784" font-size="12.5" fill="#1d1d1f">sob demanda, com humano no laço</text>
  <line x1="880" y1="780" x2="930" y2="780" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="940" y="784" font-size="12.5" fill="#1d1d1f">configuração remota e consultas (catálogo, zonas, MCP)</text>
</svg>
